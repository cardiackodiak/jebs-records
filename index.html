<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jeb's Records</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <main class="page">
    <section class="ambient-view" aria-label="Currently spinning record">
      <div
        id="app-status"
        class="app-status"
        role="status"
        aria-live="polite"
      >
        <span class="app-status-dot" aria-hidden="true"></span>
        <span id="app-status-text">Loading collection</span>
      </div>

      <img
        id="now-cover"
        class="jacket"
        src="images/placeholder-cover.svg"
        alt=""
        style="opacity: 0"
      />

      <section id="now-details" class="now-details" aria-hidden="true">
        <header class="liner-header">
          <p class="details-label">Liner Notes</p>
          <h2 id="now-artist" style="opacity: 0"></h2>
          <p id="now-title" style="opacity: 0"></p>
          <p id="now-meta" class="now-meta"></p>
          <p id="now-genres" class="now-genres"></p>
        </header>

        <div class="liner-divider" aria-hidden="true"></div>

        <div
          id="now-tracklist"
          class="tracklist"
          aria-label="Track listing"
        ></div>
      </section>

      <div class="ambient-controls">
        <button
          id="browse-button"
          class="ambient-hint"
          type="button"
          aria-label="Browse collection"
        >
          <span>Browse</span>
          <span class="ambient-hint-arrow" aria-hidden="true">→</span>
        </button>
      </div>
    </section>
  </main>

  <section id="browse-overlay" class="overlay" aria-hidden="true">

    <div id="browse-background"></div>

    <div class="overlay-content">

      <div class="overlay-header">

        <div class="browse-info">
          <div class="browse-label">Browsing</div>

          <h2 id="browse-artist"></h2>
          <p id="browse-title"></p>

          <div id="browse-meta"></div>
        </div>

        <div class="browse-actions">
          <input id="search-input" type="search" placeholder="Search artist or album...">

          <button id="close-browse" class="close-button">
            Close
          </button>

          <p id="album-count" class="album-count">
          </p>
        </div>

      </div>

      <div id="album-grid" class="album-grid">
        <div id="browse-empty" class="browse-empty" hidden>
          <p id="browse-empty-title" class="browse-empty-title"></p>
          <p id="browse-empty-message" class="browse-empty-message"></p>
        </div>
      </div>

    </div>

  </section>


  <script src="js/app.js"></script>
</body>

</html>
